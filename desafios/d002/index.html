<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Na linguagem HTML nos podemos usar algumas tags como:</p>
    <ul>
        <li><abbr title="Tag: &lt;P&gt;">Parágrafo</abbr></li>
        <li><abbr title="Tags: &lt;h1&gt; até &lt;h6&gt;">Titulos</abbr></li>
        <li><abbr title="Tag: &lt;img&gt;">imagens</abbr></li>
        <li><abbr title="Tag: &lt;abbr&gt;">abreviações</abbr></li>
        <li><abbr title="Tag: &lt;code&gt;">códigos-fonte</abbr></li>
        <li><abbr title="Tag &lt;ol&gt; e &lt;li&gt;">listas numeradas</abbr></li>
        <li><abbr title="Tag: &lt;ul&gt; e &lt;li&gt;">listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
