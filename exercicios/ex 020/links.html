<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoelementos</title>
    <style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }
    a{
        color: red;
        text-decoration: none;
        font-weight: bold;
    }
    a:visited{
        color: darkred;
    }
    a:hover{
        color: black;
        text-decoration: underline;
    }
    a:active{
        color: yellow;
    }
    a::after{
        content: ♥;
    }
    </style>
</head>
<body>
    <h1>usando links</h1>
    <ul>
        <li><div><a href="https://www.cursoemvideo.com">curso em video</a></div></li>
        <li><div><a href="https://www.youtube.com/cursoemvideo">canal do youtube</a></div></li>
        <li><div><a href="https://gustavoguanabara.github.io">repositorio</a></div></li>
    </ul>
</body>
</html>
