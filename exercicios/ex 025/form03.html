<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="off">
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" autocomplete="name" required maxlength="30">
        </p>

        <p>
            <label for="imedia">média</label>
            <input type="number" name="media" id="imedia" required value="5" step="0.1" min="0" max="10">
        </p>

        <p>
            <label for="imes">Periodo letivo</label>
            <input type="month" name="mes" id="imes" required value="2025-09">
        </p>

        <p>
            <label for="idia">data da prova</label>
            <input type="date" name="dia" id="idia" required value="2025-09-29">
        </p>

        <p>
            <label for="ihora">horario da prova</label>
            <input type="time" name="hora" id="ihora" required>
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="apagar">
        </p>
    </form>
</body>
</html>
